# ThermalTools — vatios de cada modo
# Copia en ~/.config/thermaltools/modos.conf y ajusta a tu CPU.
#
# modo         PL1(W)  PL2(W)  perfil
#   PL1 = limite sostenido, PL2 = limite de picos cortos (PL2 >= PL1).
#   perfil = power-saver | balanced | performance
#
# Valores medidos en un i9-13950HX (fabrica: 220/220 W) con RTX 4060:
#   - chill a 55 W de pico: CPU estable a 68 °C con los 32 hilos al 100 %.
#   - juego: el juego va limitado por la GPU, asi que 110 W no cuesta fps.
# Este fichero solo se lee (no se ejecuta). Lineas no validas se ignoran.

chill        35   55   power-saver
equilibrado  65   100  balanced
juego        110  140  performance
nolimit      220  220  performance
